<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
<body class="w3-container">

<input class="w3-radio" type="radio" name="gender" value="male" checked>
<label>喝</label>
<input class="w3-radio" type="radio" name="gender" value="female">
<label>不喝</label> <p>

<select class="w3-select" name="option">
  <option value="" disabled selected>杯數</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
</select> <p>

<input class="w3-check" type="checkbox" checked>
<label>水</label>
<input class="w3-check" type="checkbox">
<label>飲料</label> <p>

<select class="w3-select" name="option" size=2 multiple>
  <option value="" disabled selected>甚麼</option>
  <option value="1">紅茶</option>
  <option value="2">水</option>
  <option value="3">奶茶</option>
</select> <p>

<div class="w3-grid"
style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px">
<input class="w3-input w3-border" type="text" placeholder="One">
</div><p>

<button class="w3-button w3-green">送出</button>
<button class="w3-button w3-blue">重製</button>
